name: Update configs

on:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов
  workflow_dispatch:         # ручной запуск кнопкой

permissions:
  contents: write

concurrency:
  group: update-configs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xray-core
        run: |
          curl -sL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip xray -d /usr/local/bin
          chmod +x /usr/local/bin/xray
          xray version | head -1

      - name: Run checker
        run: python checker.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 1test_config.txt 2test_config.txt
          git diff --cached --quiet || (git commit -m "Update configs $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)

